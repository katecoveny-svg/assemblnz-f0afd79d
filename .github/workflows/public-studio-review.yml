name: Public Studio review
on:
  pull_request:
    paths:
      - 'app/pursuit/studio/**'
      - 'lib/studio/public-project*'
      - 'lib/studio/motion-video*'
      - 'components/client-hub-migration/original/lib/motion-video.ts'
      - 'components/site/GlobalChrome.tsx'
      - 'components/site/assembl-the-work/ProductLanding.tsx'
      - 'components/site/pursuit/PursuitLanding.tsx'
      - 'middleware.ts'
      - 'scripts/public-studio-browser.cjs'
      - '.github/workflows/public-studio-review.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: public-studio-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @assembl/canvas build
      - run: pnpm typecheck
      - run: pnpm exec eslint app/pursuit/studio lib/studio/public-project.ts lib/studio/public-project.test.ts lib/studio/motion-video.ts lib/studio/motion-video.test.ts components/site/GlobalChrome.tsx components/site/pursuit/PursuitLanding.tsx components/site/assembl-the-work/ProductLanding.tsx middleware.ts
      - run: pnpm test lib/studio/public-project.test.ts lib/studio/motion-video.test.ts lib/auth/public-entry.test.ts lib/supabase/middleware.test.ts lib/voice/assembl/route.test.ts app/api/creative/image/route.test.ts
      - run: pnpm lint:macrons
      - run: pnpm build
      - run: npm install --prefix /tmp/studio-browser playwright@1.56.1 && /tmp/studio-browser/node_modules/.bin/playwright install --with-deps chromium
      - run: |
          pnpm start --port 3190 > /tmp/studio-server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:3190/pursuit/studio >/dev/null && break; sleep 2; done
      - run: node scripts/public-studio-browser.cjs
        env:
          PLAYWRIGHT_MODULE: /tmp/studio-browser/node_modules/playwright
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-studio-proof
          path: |
            output/playwright/studio-*
            output/playwright/assembl-film.*
            /tmp/studio-server.log
