# Validate and deploy Supabase database migrations for assembl-prod.
#
# Pull requests that touch supabase/migrations run a dry-run against the linked
# project. Pushes to main apply only migrations not already recorded in
# supabase_migrations.schema_migrations.
#
# Required repo secrets:
# - DEPLOY: Supabase personal access token
# - SUPABASE_DB_PASSWORD: database password for project wurwcrgxjjwqdaxqceey

name: Deploy Supabase Migrations

on:
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - '.github/workflows/db-migrate.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - '.github/workflows/db-migrate.yml'
  workflow_dispatch:

concurrency:
  group: db-migrate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  migrate:
    name: ${{ github.event_name == 'pull_request' && 'Dry-run migrations' || 'Apply migrations' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Check required secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.DEPLOY }}
          DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo '::error::Missing repo secret DEPLOY'; exit 1; }
          test -n "$DB_PASSWORD" || { echo '::error::Missing repo secret SUPABASE_DB_PASSWORD'; exit 1; }

      - name: Link assembl-prod
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.DEPLOY }}
          DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PROJECT_REF: wurwcrgxjjwqdaxqceey
        run: supabase link --project-ref "$PROJECT_REF" --password "$DB_PASSWORD"

      - name: Dry-run database migrations
        if: github.event_name == 'pull_request'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.DEPLOY }}
          DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          supabase db push --dry-run --password "$DB_PASSWORD"
          {
            echo '## Supabase migration dry-run'
            echo ''
            echo 'The CLI accepted the migration history and generated the pending migration plan without applying it.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Apply pending database migrations
        if: github.event_name != 'pull_request'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.DEPLOY }}
          DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          supabase db push --password "$DB_PASSWORD"
          {
            echo '## Supabase migration deploy'
            echo ''
            echo 'Pending migrations were applied to assembl-prod. Existing migration history was left unchanged.'
          } >> "$GITHUB_STEP_SUMMARY"
