name: DO core validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'app/do/**'
      - 'app/api/do/**'
      - 'apps/do/**'
      - 'components/do/**'
      - 'components/site/assembl-the-work/**'
      - 'lib/os/**'
      - 'lib/connectors/pipedream.ts'
      - 'docs/DO-*.md'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'vercel.json'
      - 'scripts/public-front-door-guard.mjs'
      - 'scripts/vercel-ignore-build.mjs'
      - '.github/workflows/builderdoo-validation.yml'
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build shared canvas
        run: pnpm --filter @assembl/canvas build
      - name: Typecheck
        run: pnpm typecheck
      - name: DO core unit tests
        run: pnpm test apps/do/shared app/api/do lib/os/improvement.test.ts lib/os/routing.test.ts
      - name: Production build
        run: pnpm build
