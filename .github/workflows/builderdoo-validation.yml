name: DO core validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'app/api/do/**'
      - 'app/do/**'
      - 'apps/do/**'
      - 'lib/os/improvement*'
      - 'lib/os/routing*'
      - 'lib/ai/router.ts'
      - 'lib/ai/call-log.ts'
      - 'lib/connectors/**'
      - 'docs/factory/PRIMITIVES.md'
      - 'vercel.json'
      - 'scripts/vercel-ignore-build.mjs'
      - '.github/workflows/builderdoo-validation.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build shared canvas
        run: pnpm --filter @assembl/canvas build
      - name: Typecheck
        run: pnpm typecheck
      - name: DO core unit tests
        run: pnpm test apps/do/shared/builder.test.ts lib/os/improvement.test.ts
      - name: Production build
        run: pnpm build
