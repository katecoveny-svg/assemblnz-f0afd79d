name: DO core validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'app/do/**'
      - 'app/api/do/**'
      - 'apps/do/**'
      - 'components/do/**'
      - 'components/site/assembl-the-work/**'
      - 'lib/os/**'
      - 'lib/connectors/pipedream.ts'
      - 'lib/connectors/pipedream.test.ts'
      - 'lib/auth/**'
      - 'app/login/**'
      - 'app/auth/**'
      - 'middleware.ts'
      - 'docs/DO-*.md'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'vercel.json'
      - 'scripts/public-front-door-guard.mjs'
      - 'scripts/vercel-ignore-build.mjs'
      - '.github/workflows/builderdoo-validation.yml'
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build shared canvas
        run: pnpm --filter @assembl/canvas build
      - name: Typecheck
        run: pnpm typecheck
      - name: DO core unit tests
        run: pnpm test apps/do/shared apps/do/personal app/api/do app/do/personal lib/do/nz-public-data.test.ts lib/do/nz-local-updates.test.ts lib/do/do-pwa.test.ts lib/typesafe lib/os/improvement.test.ts lib/os/routing.test.ts lib/connectors/pipedream.test.ts
      - name: Production build
        run: pnpm build
      - name: Install isolated browser verification tools
        run: |
          npm install --prefix /tmp/assembl-browser --no-save playwright@1.55.0
          node /tmp/assembl-browser/node_modules/playwright/cli.js install --with-deps chromium
          echo "ASSEMBL_PLAYWRIGHT_MODULE=/tmp/assembl-browser/node_modules/playwright" >> "$GITHUB_ENV"
          node -e "console.log('ASSEMBL_CHROMIUM_PATH=' + require('/tmp/assembl-browser/node_modules/playwright').chromium.executablePath())" >> "$GITHUB_ENV"
      - name: Personal DO browser proof with fictional account and audio fixtures
        env:
          ASSEMBL_REVIEW_ORIGIN: http://127.0.0.1:3117
        run: |
          set -euo pipefail
          node node_modules/next/dist/bin/next start --hostname 127.0.0.1 --port 3117 > /tmp/personal-do-server.log 2>&1 &
          server=$!
          trap 'kill "$server" || true' EXIT
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:3117/do/personal >/dev/null && break; sleep 2; done
          set +e
          ASSEMBL_REVIEW_OUTPUT=/tmp/personal-do-proof/settings node scripts/review-do-personal-settings.cjs
          settings_status=$?
          ASSEMBL_REVIEW_OUTPUT=/tmp/personal-do-proof/calls node scripts/review-do-personal-call.cjs
          calls_status=$?
          ASSEMBL_REVIEW_OUTPUT=/tmp/personal-do-proof/portable node scripts/review-do-portable.cjs
          portable_status=$?
          ASSEMBL_REVIEW_OUTPUT=/tmp/personal-do-proof/assistant node scripts/review-do-personal-assistant.cjs
          assistant_status=$?
          set -e
          test "$settings_status" -eq 0 && test "$calls_status" -eq 0 && test "$portable_status" -eq 0 && test "$assistant_status" -eq 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: personal-do-browser-proof
          path: |
            /tmp/personal-do-proof/
            /tmp/personal-do-server.log
          if-no-files-found: warn
          retention-days: 14
