name: Public pursuit review
on:
  pull_request:
    paths:
      - 'lib/pursuit/**'
      - 'app/api/pursuit/research/**'
      - 'app/api/knowledge/**'
      - 'components/site/pursuit/**'
      - 'scripts/public-pursuit-browser.py'
      - '.github/workflows/public-pursuit-review.yml'
  push:
    branches: ['feat/pursuit-live-canvas-20260918']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: public-pursuit-review-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @assembl/canvas build
      - run: pnpm typecheck
      - run: pnpm test lib/pursuit/public-format.test.ts lib/pursuit/public-response.test.ts lib/pursuit/public-contract.test.ts lib/pursuit/pitch-export.test.ts components/site/assembl-the-work/hero-resilience.test.ts
      - run: pnpm exec eslint components/site/pursuit/LivePursuitCanvas.tsx components/site/pursuit/PursuitLanding.tsx lib/pursuit/pitch-export.ts lib/pursuit/public-format.ts lib/pursuit/public-response.ts lib/pursuit/public-research.ts lib/pursuit/public-store.ts app/api/knowledge app/api/pursuit/research
      - run: pnpm build
      - run: pip install playwright==1.55.0 && playwright install --with-deps chromium
      - run: |
          pnpm start > /tmp/assembl-public.log 2>&1 &
          for i in $(seq 1 45); do curl -sf http://127.0.0.1:3000/ >/dev/null && break; sleep 2; done
      - run: python scripts/public-pursuit-browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-pursuit-review
          path: visual-evidence/public-pursuit/
          retention-days: 14
