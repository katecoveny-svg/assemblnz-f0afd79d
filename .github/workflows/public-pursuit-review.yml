name: Public pursuit review
on:
  pull_request:
    paths:
      - 'lib/pursuit/**'
      - 'lib/product-destinations*'
      - 'lib/creative/assembl-brand.ts'
      - 'lib/creative/generate*'
      - 'lib/creative/costs.ts'
      - 'lib/creative/canvas-font.ts'
      - 'components/creative-studio/**'
      - 'app/creative-studio/assembl/**'
      - 'app/api/creative/image/**'
      - 'app/api/pursuit/research/**'
      - 'app/api/knowledge/**'
      - 'components/site/pursuit/**'
      - 'scripts/public-pursuit-browser.py'
      - '.github/workflows/public-pursuit-review.yml'
  push:
    branches: ['feat/pursuit-live-canvas-20260918']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: public-pursuit-review-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @assembl/canvas build
      - run: pnpm typecheck
      - run: pnpm test lib/creative/generate.test.ts app/api/pursuit/research/route.test.ts app/api/creative/image/route.test.ts lib/product-destinations.test.ts lib/public-nav-allowlist.test.ts lib/auth/public-entry.test.ts components/site/public-company-pages.test.ts lib/pursuit/outreach.test.ts lib/pursuit/public-format.test.ts lib/pursuit/public-response.test.ts lib/pursuit/public-contract.test.ts lib/pursuit/pitch-export.test.ts components/site/assembl-the-work/hero-resilience.test.ts
      - run: pnpm exec eslint lib/creative/generate.ts lib/creative/generate.test.ts components/creative-studio/CreativeStudioShell.tsx components/creative-studio/BrandImageMaker.tsx components/site/pursuit/useResearchAvailability.ts components/site/pursuit/PursuitCanvasHero.tsx components/site/pursuit/WebsiteOutreach.tsx lib/pursuit/outreach.ts lib/pursuit/outreach-prompt.ts lib/pursuit/outreach.test.ts components/site/pursuit/LivePursuitCanvas.tsx components/site/pursuit/PursuitLanding.tsx lib/pursuit/pitch-export.ts lib/pursuit/public-format.ts lib/pursuit/public-response.ts lib/pursuit/public-research.ts lib/pursuit/public-store.ts app/api/knowledge app/api/pursuit/research
      - name: Build the browser review with webpack and existing brand guards
        # The clean Turbopack build currently fails in the pre-existing Air NZ
        # Inter Tight font module. Keep production settings unchanged while
        # exercising the complete application in this UI/export verification.
        run: |
          node scripts/brand-guard.mjs
          node scripts/public-front-door-guard.mjs
          pnpm exec next build --webpack
      - run: pip install playwright==1.55.0 && playwright install --with-deps chromium
      - run: |
          pnpm start > /tmp/assembl-public.log 2>&1 &
          for i in $(seq 1 45); do curl -sf http://127.0.0.1:3000/ >/dev/null && break; sleep 2; done
      - run: python scripts/public-pursuit-browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-pursuit-review
          path: visual-evidence/public-pursuit/
          retention-days: 14
