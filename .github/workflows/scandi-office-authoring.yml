name: Scandi office authoring
on:
  push:
    branches: ['design/scandi-office-source-20260918']
    paths:
      - 'scripts/design/*.py'
      - '.github/workflows/scandi-office-authoring.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: scandi-office-authoring
  cancel-in-progress: true
jobs:
  render:
    if: github.ref == 'refs/heads/design/scandi-office-source-20260918'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
      - name: Install Blender and exporter dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y blender python3-numpy
      - name: Export and render original scene
        run: |
          set -euo pipefail
          mkdir -p visual-evidence/scandi
          blender -b -t 4 --python-exit-code 1 --python scripts/design/render_scandi_review.py 2>&1 | tee visual-evidence/scandi/render.log
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('public/do/world/scandi-v1')
          for name in ['scandi-office.glb','harbour-workroom.jpg','review-room.jpg','studio-lounge.jpg','scene-manifest.json']:
              p=root/name
              assert p.is_file() and p.stat().st_size>10, f'Missing output: {name}'
          model=root/'scandi-office.glb'
          assert model.read_bytes()[:4]==b'glTF', 'Invalid glTF binary'
          assert model.stat().st_size<12_000_000, 'Model exceeds authoring budget'
          assert Path('visual-evidence/scandi/scandi-office.blend').is_file(), 'Missing editable Blender source'
          print(json.loads((root/'scene-manifest.json').read_text()))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scandi-office-source-and-renders
          path: |
            visual-evidence/
            public/do/world/scandi-v1/
          retention-days: 14
      - name: Commit generated assets only to isolated branch
        run: |
          test "${GITHUB_REF}" = 'refs/heads/design/scandi-office-source-20260918'
          test -s public/do/world/scandi-v1/scene-manifest.json
          git config user.name 'Assembl asset builder'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- public/do/world/scandi-v1
          if ! git diff --cached --quiet; then
            git commit -m 'art: generated Blender office GLB and three owned architectural renders'
            git push origin HEAD:refs/heads/design/scandi-office-source-20260918
          fi
