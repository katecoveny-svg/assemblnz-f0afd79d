name: Supabase Edge Functions Deploy

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - "supabase/config.toml"
      - ".github/workflows/supabase-deploy.yml"
  pull_request:
    paths:
      - "supabase/functions/**"
      - "supabase/config.toml"
      - ".github/workflows/supabase-deploy.yml"
  workflow_dispatch:

concurrency:
  group: supabase-edge-functions-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate function deploy plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: List deployable functions
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t FUNCTIONS < <(find supabase/functions \
            -mindepth 1 \
            -maxdepth 1 \
            -type d \
            -not -name "_shared" \
            -exec test -f "{}/index.ts" ";" \
            -printf "%f\n" | sort)

          echo "Found ${#FUNCTIONS[@]} deployable functions."
          printf "%s\n" "${FUNCTIONS[@]}"

          {
            echo "## Supabase edge function deploy plan"
            echo ""
            echo "Database migrations are intentionally excluded from this workflow."
            echo "Apply migration SQL manually in the Supabase Dashboard SQL Editor."
            echo ""
            echo "### Deployable functions (${#FUNCTIONS[@]})"
            echo ""
            printf -- "- \`%s\`\n" "${FUNCTIONS[@]}"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-functions:
    name: Deploy edge functions
    needs: validate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.DEPLOY }}
      PROJECT_REF: wurwcrgxjjwqdaxqceey
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy functions
        shell: bash
        run: |
          set +e

          mapfile -t FUNCTIONS < <(find supabase/functions \
            -mindepth 1 \
            -maxdepth 1 \
            -type d \
            -not -name "_shared" \
            -exec test -f "{}/index.ts" ";" \
            -printf "%f\n" | sort)

          TOTAL=${#FUNCTIONS[@]}
          DEPLOYED=0
          FAILED=0
          declare -a DEPLOYED_NAMES
          declare -a FAILED_NAMES

          echo "::group::Functions to deploy ($TOTAL total)"
          printf "%s\n" "${FUNCTIONS[@]}"
          echo "::endgroup::"

          for fn in "${FUNCTIONS[@]}"; do
            echo "::group::Deploy $fn"
            if supabase functions deploy "$fn" --project-ref "$PROJECT_REF" --use-api --workdir supabase; then
              DEPLOYED=$((DEPLOYED + 1))
              DEPLOYED_NAMES+=("$fn")
            else
              FAILED=$((FAILED + 1))
              FAILED_NAMES+=("$fn")
              echo "::error::Deploy failed: $fn"
            fi
            echo "::endgroup::"
          done

          {
            echo "## Supabase edge function deploy"
            echo ""
            echo "- Project: \`$PROJECT_REF\`"
            echo "- Total: $TOTAL"
            echo "- Deployed: $DEPLOYED"
            echo "- Failed: $FAILED"
            echo ""
            if [ "${#FAILED_NAMES[@]}" -gt 0 ]; then
              echo "### Failed"
              printf -- "- \`%s\`\n" "${FAILED_NAMES[@]}"
              echo ""
            fi
            if [ "${#DEPLOYED_NAMES[@]}" -gt 0 ]; then
              echo "<details><summary>Deployed functions</summary>"
              echo ""
              printf -- "- \`%s\`\n" "${DEPLOYED_NAMES[@]}"
              echo ""
              echo "</details>"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          [ "$FAILED" -eq 0 ]
