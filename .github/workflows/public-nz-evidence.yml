name: Public NZ evidence boundary
on:
  pull_request:
    paths:
      - 'lib/public-nz/**'
      - 'lib/pursuit/public-research.ts'
      - 'app/api/home/live/**'
      - 'app/api/knowledge/search/**'
      - 'components/site/HomeLiveData.tsx'
      - 'components/site/assembl-the-work/AssemblTheWorkHome.tsx'
      - 'components/site/assembl-the-work/public-nz-home.css'
      - '.github/workflows/public-nz-evidence.yml'
permissions:
  contents: read
concurrency:
  group: public-nz-evidence-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @assembl/canvas build
      - run: pnpm typecheck
      - name: Public boundary, transport, API and consumer contracts
        run: pnpm exec vitest run lib/public-nz app/api/home/live/route.test.ts lib/pursuit/public-contract.test.ts lib/pursuit/pitch-export.test.ts lib/pursuit/outreach.test.ts
      - name: Scoped lint
        run: pnpm exec eslint lib/public-nz app/api/home/live app/api/knowledge/search/route.ts components/site/HomeLiveData.tsx components/site/assembl-the-work/AssemblTheWorkHome.tsx lib/pursuit/public-research.ts --max-warnings=0
      - name: Brand and public front door
        run: |
          node scripts/brand-guard.mjs
          node scripts/public-front-door-guard.mjs
          node --import tsx scripts/lint-macrons.ts
      - name: Exact-head production build
        run: pnpm build
