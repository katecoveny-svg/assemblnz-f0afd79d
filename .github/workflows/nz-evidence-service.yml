name: Inactive NZ evidence service
on:
  pull_request:
    paths:
      - 'lib/nz-evidence/**'
      - 'docs/services/nz-evidence-pilot.md'
      - '.github/workflows/nz-evidence-service.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
permissions:
  contents: read
concurrency:
  group: nz-evidence-service-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @assembl/canvas build
      - run: pnpm typecheck
      - name: Closed resource, fixture provenance and unchanged pilot contracts
        run: pnpm exec vitest run lib/nz-evidence/service.test.ts apps/do/enquiries/service.test.ts app/api/mcp/route.test.ts lib/tools/__tests__/agent-paid-tools.test.ts
      - run: pnpm exec eslint lib/nz-evidence --max-warnings=0
      - run: git diff --check
