name: Immersive visual review
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/immersive-visual-review.yml'
      - 'scripts/immersive-browser-audit.py'
      - 'scripts/homepage-mobile-boundary-check.cjs'
      - 'scripts/review-contact-footer.cjs'
      - 'components/site/ContactChrome.tsx'
      - 'components/site/contact-chrome.module.css'
      - 'components/site/assembl-the-work/**'
      - 'components/site/pursuit/**'
      - 'components/site/GlobalChrome.tsx'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: immersive-review-${{ github.ref }}
  cancel-in-progress: true
jobs:
  proposed-browser-review:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @assembl/canvas build
      - name: Typecheck and public interaction tests
        run: |
          pnpm typecheck
          pnpm test components/site/assembl-the-work/copy.test.ts components/site/assembl-the-work/immersive-experience.test.ts components/site/assembl-the-work/hero-resilience.test.ts
          pnpm exec eslint components/site/assembl-the-work/ImmersiveExperience.tsx components/site/assembl-the-work/AssemblTheWorkHome.tsx components/site/assembl-the-work/AssemblWorldHero.tsx components/site/assembl-the-work/ProductLanding.tsx components/site/GlobalChrome.tsx
      - name: Production build with existing brand guards
        run: pnpm build
      - run: pip install playwright==1.55.0
      - run: playwright install --with-deps chromium
      - name: Start the built app
        run: |
          pnpm start > /tmp/assembl-public-server.log 2>&1 &
          for i in $(seq 1 40); do curl -sf http://127.0.0.1:3000/ >/dev/null && break; sleep 2; done
      - name: Verify exact candidate and phone height boundaries
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          HOMEPAGE_URL: http://127.0.0.1:3000
          HOMEPAGE_RESULTS: visual-evidence/homepage-copy/boundary-results.json
          REVIEW_ORIGIN: http://127.0.0.1:3000
          REVIEW_OUTPUT: visual-evidence/contact-footer
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          mkdir -p visual-evidence/homepage-copy
          export PLAYWRIGHT_MODULE="$(python -c 'import pathlib, playwright; print(pathlib.Path(playwright.__file__).parent / "driver" / "package")')"
          export CHROMIUM_PATH="$(python -c 'from playwright.sync_api import sync_playwright; p = sync_playwright().start(); print(p.chromium.executable_path); p.stop()')"
          node scripts/homepage-mobile-boundary-check.cjs
          node scripts/review-contact-footer.cjs
      - name: Exercise local interactions and capture phone and desktop evidence
        run: python scripts/immersive-browser-audit.py --local
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: immersive-browser-proposed
          path: visual-evidence/
          retention-days: 7
