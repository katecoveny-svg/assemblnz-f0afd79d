name: agent-orchestrator

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  orchestrator:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install root dependencies
        run: pnpm install

      - name: Install legacy-vite dependencies
        run: cd legacy-vite && pnpm install

      - name: Kete name check
        run: cd legacy-vite && pnpm run check:kete-names

      - name: Predeploy validation
        run: cd legacy-vite && pnpm run predeploy:agents

      - name: Run legacy tests
        run: cd legacy-vite && pnpm run test

      - name: Build Next.js app
        run: pnpm run build
