name: Splat atelier smoke
on:
  push:
    branches: [prototype/splat-auckland-atelier-20260918]
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm start > /tmp/assembl.log 2>&1 &
      - run: |
          for i in $(seq 1 45); do
            curl -sf http://127.0.0.1:3000/preview/splat-atelier >/dev/null && break
            sleep 2
          done
      - run: |
          cat > /tmp/splat-smoke.mjs <<'JS'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({args:['--enable-webgl','--use-gl=angle','--use-angle=swiftshader','--enable-unsafe-swiftshader']});
          for (const viewport of [{width:1440,height:900},{width:375,height:812}]) {
            const page = await browser.newPage({viewport});
            const errors=[];
            page.on('pageerror', e => errors.push(String(e)));
            page.on('console', m => { if (m.type()==='error') errors.push(m.text()); });
            const response=await page.goto('http://127.0.0.1:3000/preview/splat-atelier',{waitUntil:'domcontentloaded',timeout:30000});
            if (!response || response.status()!==200) throw new Error('route did not return 200');
            await page.waitForTimeout(8000);
            if (await page.locator('canvas').count() < 1) throw new Error('Spark canvas did not mount');
            await page.evaluate(()=>window.scrollTo({top:document.body.scrollHeight,behavior:'instant'}));
            await page.waitForTimeout(1200);
            await page.screenshot({path:'splat-'+viewport.width+'.png',fullPage:false});
            if (errors.length) throw new Error(errors.join('\n'));
            await page.close();
          }
          await browser.close();
          JS
          node /tmp/splat-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: splat-atelier-smoke
          path: splat-*.png
          retention-days: 5
