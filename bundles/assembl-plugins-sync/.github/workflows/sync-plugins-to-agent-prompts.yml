name: Sync plugins → agent_prompts

# Lives in: katecoveny-svg/assembl-plugins
# Mirrors every plugin folder (top-level + one-level sub-plugins) into the
# canonical Supabase agent_prompts table on Lovable Cloud project
# ssaxxdkxzrvkdjsanhei.
#
# Required repo secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_URL                e.g. https://ssaxxdkxzrvkdjsanhei.supabase.co
#   SUPABASE_SERVICE_ROLE_KEY   service role key for that project

on:
  push:
    branches: [main]
    paths:
      - "**/agent.yaml"
      - "**/system-prompt.md"
      - "scripts/sync-plugins-to-agent-prompts.mjs"
      - ".github/workflows/sync-plugins-to-agent-prompts.yml"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (report only, no DB writes)"
        type: boolean
        default: false
      only:
        description: "Only sync plugin folders whose name contains this string"
        type: string
        default: ""

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install minimal deps
        run: npm install --no-save @supabase/supabase-js@2

      - name: Run sync
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ -n "${{ github.event.inputs.only }}" ]; then ARGS="$ARGS --only=${{ github.event.inputs.only }}"; fi
          node scripts/sync-plugins-to-agent-prompts.mjs $ARGS
