  // ---- lifecycle -----------------------------------------------------------
  componentDidMount() {
    const load = (f) => { try { document.fonts.load(f); } catch (e) {} };
    load("600 100px 'Instrument Sans'"); load("500 100px 'Instrument Sans'"); load("400 20px 'IBM Plex Mono'"); load("500 20px 'IBM Plex Mono'");
    this._t0 = performance.now();
    const tick = () => {
      this._raf = requestAnimationFrame(tick);
      const cv = this.canvasRef.current;
      if (!cv) return;
      const r = cv.getBoundingClientRect();
      if (r.width < 4) return;
      const dpr = Math.min(2, window.devicePixelRatio || 1);
      const W = Math.round(r.width * dpr), H = Math.round(r.height * dpr);
      if (cv.width !== W || cv.height !== H) { cv.width = W; cv.height = H; }
      const D = (this.props.loopSeconds ?? 6) * 1000;
      const phase = ((performance.now() - this._t0) % D) / D;
      this._phase = phase;
      const act = this._mT && performance.now() - this._mT < 1800 ? 1 : 0;
      this._mFade = (this._mFade || 0) + (act - (this._mFade || 0)) * 0.08;
      const c2d = cv.getContext('2d');
      this.renderScene(c2d, W, H, phase, this.state);
      if (this.state.wordmark) this.drawWordmark(c2d, W, H);
    };
    tick();
  }
  componentWillUnmount() { cancelAnimationFrame(this._raf); }

  // ---- helpers -------------------------------------------------------------
  rng(seed) { let a = seed >>> 0; return () => { a = (a + 0x6d2b79f5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
  noiseFn(seed) {
    const rand = this.rng(seed); const g = 64;
    const grid = Array.from({ length: g }, () => Array.from({ length: g }, () => rand()));
    const sm = (t) => t * t * (3 - 2 * t);
    return (x, y) => {
      const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
      const gv = (a, b) => grid[((a % g) + g) % g][((b % g) + g) % g];
      const u = sm(xf), v = sm(yf);
      const A = gv(xi, yi), B = gv(xi + 1, yi), C = gv(xi, yi + 1), Dd = gv(xi + 1, yi + 1);
      return A + u * (B - A) + v * (C - A) + u * v * (A - B - C + Dd);
    };
  }
  easeIO(t) { return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; }
  seg(phase, a, b) { return Math.max(0, Math.min(1, (phase - a) / (b - a))); }

  buildMask(text, count, seed) {
    const key = text + '|' + count + '|' + seed;
    if (this._maskCache[key]) return this._maskCache[key];
    const isEmoji = /\p{Extended_Pictographic}/u.test(text);
    const SW = isEmoji ? 480 : 900, SH = isEmoji ? 480 : 440;
    const oc = document.createElement('canvas'); oc.width = SW; oc.height = SH;
    const c = oc.getContext('2d');
    c.fillStyle = '#000';
    if (isEmoji) {
      c.font = "380px 'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',serif";
      c.textAlign = 'center'; c.textBaseline = 'middle';
      c.fillText(text, SW / 2, SH / 2 + 20);
    } else {
      let fs = 260;
      c.font = "600 " + fs + "px 'Instrument Sans', sans-serif";
      const w = c.measureText(text).width;
      fs = Math.min(340, fs * (SW * 0.92) / Math.max(1, w));
      c.font = "600 " + fs + "px 'Instrument Sans', sans-serif";
      c.textAlign = 'center'; c.textBaseline = 'middle';
      c.fillText(text, SW / 2, SH / 2);
    }
    const img = c.getImageData(0, 0, SW, SH).data;
    const cells = [];
    const step = 3;
    const jr = this.rng(seed * 3 + 5);
    for (let y = 0; y < SH; y += step) for (let x = 0; x < SW; x += step) {
      if (img[(y * SW + x) * 4 + 3] > 100) cells.push([(x + (jr() - 0.5) * 1.4) / SW, (y + (jr() - 0.5) * 1.4) / SH]);
    }
    const rand = this.rng(seed * 7 + 13);
    for (let i = cells.length - 1; i > 0; i--) { const j = Math.floor(rand() * (i + 1)); const t = cells[i]; cells[i] = cells[j]; cells[j] = t; }
    const pts = cells.slice(0, Math.min(count, cells.length));
    // bounds normalise
    let minX = 1, maxX = 0, minY = 1, maxY = 0;
    for (const p of pts) { minX = Math.min(minX, p[0]); maxX = Math.max(maxX, p[0]); minY = Math.min(minY, p[1]); maxY = Math.max(maxY, p[1]); }
    const sx = maxX - minX || 1, sy = maxY - minY || 1;
    const out = pts.map((p) => [(p[0] - minX) / sx, (p[1] - minY) / sy]);
    out.aspect = (sx * SW) / (sy * SH);
    this._maskCache[key] = out;
    return out;
  }

  // ---- caption — custom words over any generation ------------------------------
  drawCaption(ctx, W, H, S, P) {
    const u = Math.min(W, H);
    const pad = u * 0.07;
    const mono = S.capStyle === 'mono';
    const fs = mono ? Math.max(11, u * 0.026) : Math.max(16, u * 0.062);
    ctx.save();
    ctx.font = (mono ? "500 " + Math.round(fs) + "px 'IBM Plex Mono', monospace" : "600 " + Math.round(fs) + "px 'Instrument Sans', sans-serif");
    const words = S.capText.trim().split(/\s+/);
    const maxW = W - pad * 2 - u * 0.2;
    let line = '', lines = [];
    for (const w2 of words) {
      const t = line ? line + ' ' + w2 : w2;
      if (ctx.measureText(t).width > maxW && line) { lines.push(line); line = w2; } else line = t;
    }
    lines.push(line);
    const lhh = fs * 1.15;
    ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
    ctx.shadowColor = S.mode === 'night' ? 'rgba(18,5,16,0.75)' : 'rgba(255,253,251,0.75)';
    ctx.shadowBlur = fs * 0.45;
    ctx.fillStyle = mono ? P.mid : P.ink;
    lines.forEach((ln, i) => {
      const y = H - pad - (lines.length - 1 - i) * lhh;
      ctx.fillText(ln, pad, y);
      ctx.fillText(ln, pad, y); // double pass strengthens over busy art
    });
    ctx.restore();
  }

  // ---- wordmark (stamped on exports, auto-toned like the site) --------------
  drawWordmark(ctx, w, h) {
    const pad = Math.round(Math.min(w, h) * 0.045);
    const size = Math.max(18, Math.round(Math.min(w, h) * 0.052));
    const sub = Math.max(9, Math.round(size * 0.30));
    let light = false;
    try {
      const box = ctx.getImageData(Math.max(0, w - pad * 8), Math.max(0, h - pad * 3.4), Math.min(pad * 7, w), Math.min(pad * 2.6, h));
      let sum = 0;
      for (let i = 0; i < box.data.length; i += 4) sum += 0.299 * box.data[i] + 0.587 * box.data[i + 1] + 0.114 * box.data[i + 2];
      light = sum / (box.data.length / 4) > 128;
    } catch (e) {}
    ctx.save();
    ctx.textAlign = 'right'; ctx.textBaseline = 'alphabetic';
    const dotR = size * 0.11;
    const wmText = (this.state.demo.on && this.state.demo.name.trim()) ? this.state.demo.name.trim() + ' × assembl' : 'assembl';
    const subText = 'assembl.co.nz';
    ctx.font = "600 " + size + "px 'Instrument Sans', sans-serif";
    const tw = ctx.measureText(wmText).width + dotR * 3;
    // legibility scrim behind the mark
    const sx = w - pad - tw - size * 0.55, sy = h - pad - size - sub * 1.9, sw = tw + size * 1.1, sh = size + sub * 2.5;
    ctx.fillStyle = light ? 'rgba(255,253,251,0.55)' : 'rgba(18,5,16,0.45)';
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(sx, sy, sw, sh, sh * 0.24); else ctx.rect(sx, sy, sw, sh);
    ctx.fill();
    const inkCol = light ? 'rgba(36,11,33,0.96)' : 'rgba(245,241,242,0.96)';
    ctx.fillStyle = inkCol;
    ctx.fillText(wmText, w - pad - dotR * 3, h - pad - sub * 1.6);
    ctx.beginPath();
    ctx.arc(w - pad - dotR, h - pad - sub * 1.6 - dotR, dotR, 0, Math.PI * 2);
    ctx.fillStyle = '#E9BCA9';
    ctx.fill();
    ctx.font = "500 " + sub + "px 'IBM Plex Mono', monospace";
    ctx.fillStyle = light ? 'rgba(101,74,78,0.9)' : 'rgba(233,188,169,0.9)';
    ctx.fillText(subText, w - pad, h - pad - sub * 0.3);
    ctx.restore();
  }

  // ---- sparkle overlay — loop-safe rose-gold glints ---------------------------
  drawSparkles(ctx, W, H, phase, S, P) {
    const u = Math.min(W, H);
    const rand = this.rng(S.seed + 777);
    const n = 16 + Math.round(S.values.motion * 12);
    const col = P.hi;
    for (let i = 0; i < n; i++) {
      const r1 = rand(), r2 = rand(), r3 = rand(), r4 = rand();
      const freq = 1 + Math.floor(r3 * 2); // whole cycles → seamless loop
      const tw = Math.pow(Math.max(0, Math.sin(phase * Math.PI * 2 * freq + r4 * Math.PI * 2)), 3);
      const a = tw * (0.25 + r3 * 0.5);
      if (a < 0.02) continue;
      const x = W * r1, y = H * r2;
      const s = u * (0.007 + r2 * 0.013) * (0.6 + tw * 0.7);
      ctx.save();
      ctx.translate(x, y); ctx.rotate(r4 * Math.PI);
      ctx.globalAlpha = a;
      ctx.strokeStyle = col; ctx.lineCap = 'round'; ctx.lineWidth = Math.max(1, u * 0.0016);
      ctx.beginPath();
      ctx.moveTo(-s, 0); ctx.lineTo(s, 0);
      ctx.moveTo(0, -s); ctx.lineTo(0, s);
      ctx.moveTo(-s * 0.45, -s * 0.45); ctx.lineTo(s * 0.45, s * 0.45);
      ctx.moveTo(-s * 0.45, s * 0.45); ctx.lineTo(s * 0.45, -s * 0.45);
      ctx.stroke();
      ctx.fillStyle = col;
      ctx.beginPath(); ctx.arc(0, 0, Math.max(1, u * 0.002), 0, 6.2832); ctx.fill();
      ctx.restore();
    }
    ctx.globalAlpha = 1;
  }

  // ---- cube primitive --------------------------------------------------------
  drawCube(ctx, x, y, s, rot, cA, cB, alpha) {
    ctx.save();
    ctx.translate(x, y); ctx.rotate(rot); ctx.globalAlpha = alpha;
    const g = ctx.createLinearGradient(-s / 2, -s / 2, s / 2, s / 2);
    g.addColorStop(0, cA); g.addColorStop(1, cB);
    ctx.fillStyle = g;
    ctx.fillRect(-s / 2, -s / 2, s, s);
    ctx.fillStyle = 'rgba(18,5,16,0.22)';
    ctx.fillRect(s / 2 - s * 0.22, -s / 2, s * 0.22, s);
    ctx.restore();
  }

  // ---- scene dispatch --------------------------------------------------------
  renderScene(ctx, W, H, phase, S) {
    const P = this.PAL[S.mode];
    ctx.globalAlpha = 1;
    ctx.fillStyle = P.ground; ctx.fillRect(0, 0, W, H);
    const bgEl = S.bgPhoto ? this.mediaEl() : null;
    if (bgEl) {
      const [iw, ih] = this.mediaDims(bgEl);
      const sc = Math.max(W / iw, H / ih);
      const dw = iw * sc, dh = ih * sc;
      ctx.drawImage(bgEl, (W - dw) / 2, (H - dh) / 2, dw, dh);
      ctx.fillStyle = P.ground; ctx.globalAlpha = S.mode === 'night' ? 0.80 : 0.84;
      ctx.fillRect(0, 0, W, H);
      ctx.globalAlpha = 1;
    }
    const fn = this['draw_' + S.family];
    if (fn) fn.call(this, ctx, W, H, phase, S, P);
    if (S.sparkle && S.family !== 'print' && S.family !== 'evidence' && S.family !== 'waitstate') this.drawSparkles(ctx, W, H, phase, S, P);
    if (S.capText && S.capText.trim() && S.family !== 'composer' && S.family !== 'waitstate' && !this._noText) this.drawCaption(ctx, W, H, S, P);
  }

  assemblyPoints(text, S, W, H, scale, countOverride) {
    const count = countOverride || Math.round(140 + S.values.density * 420);
    const pts = this.buildMask(text, count, S.seed);
    const u = Math.min(W, H);
    const boxH = u * (scale ?? 0.62);
    const boxW = Math.min(W * 0.86, boxH * (pts.aspect || 1));
    const bh = boxW / (pts.aspect || 1);
    const ox = (W - boxW) / 2, oy = (H - bh) / 2;
    return { pts, ox, oy, boxW, boxH: bh, u };
  }

  drawAssembly(ctx, W, H, phase, S, P, text, colorFn, shape, countOverride) {
    const { pts, ox, oy, boxW, boxH, u } = this.assemblyPoints(text, S, W, H, undefined, countOverride);
    const rand = this.rng(S.seed);
    const nz = this._nz || (this._nz = this.noiseFn(991));
    const e1 = this.easeIO(this.seg(phase, 0.04, 0.46));
    const out = this.easeIO(this.seg(phase, 0.74, 0.97));
    const wob = 0.15 + S.values.motion * 0.85;
    for (let i = 0; i < pts.length; i++) {
      const r1 = rand(), r2 = rand(), r3 = rand(), r4 = rand();
      const tx = ox + pts[i][0] * boxW, ty = oy + pts[i][1] * boxH;
      const ang = r1 * Math.PI * 2;
      const rad = u * (0.75 + r2 * 0.55);
      const sx = W / 2 + Math.cos(ang) * rad, sy = H / 2 + Math.sin(ang) * rad;
      const delay = r3 * 0.35;
      const eIn = this.easeIO(this.seg(e1, delay, Math.min(1, delay + 0.65)));
      const eOut = this.easeIO(this.seg(out, r4 * 0.3, Math.min(1, r4 * 0.3 + 0.7)));
      let x = sx + (tx - sx) * eIn, y = sy + (ty - sy) * eIn;
      x += (tx - sx) * -0.5 * eOut; y += (ty - sy) * -0.5 * eOut - u * 0.2 * eOut;
      const wq = Math.sin(phase * Math.PI * 2 + r1 * 9) * u * 0.004 * wob * eIn;
      x += wq; y += Math.cos(phase * Math.PI * 2 + r2 * 9) * u * 0.004 * wob * eIn;
      const alpha = Math.max(0, Math.min(1, eIn * (1 - eOut)));
      if (alpha <= 0.01) continue;
      const s = u * (0.010 + 0.014 * (0.5 + S.values.detail)) * (0.7 + r2 * 0.7);
      const [cA, cB] = colorFn(r3);
      if (shape === 'dot') {
        // fine particle: small, near-uniform, crisp — the mass of dots draws the letterform
        const pr = Math.max(0.6, u * (0.0016 + 0.0014 * S.values.detail) * (0.8 + r2 * 0.45));
        ctx.globalAlpha = alpha * (cB === 'bright' ? 1 : 0.88);
        ctx.fillStyle = cA;
        ctx.beginPath(); ctx.arc(x, y, pr, 0, Math.PI * 2); ctx.fill(); ctx.globalAlpha = 1;
      } else {
        this.drawCube(ctx, x, y, s, (r1 - 0.5) * 1.2 * (1 - eIn) + (r4 - 0.5) * 0.25, cA, cB, alpha);
      }
    }
  }

  buildImgSource(S) {
    const key = this.mediaKey() + '|' + S.seed;
    if (this._imgSrcData && this._imgSrcKey === key) return this._imgSrcData;
    let sw = 440, sh = 440, aspect = 1;
    const oc = document.createElement('canvas');
    const el = this.mediaEl();
    if (el) {
      const [iw, ih] = this.mediaDims(el);
      aspect = iw / ih;
      if (aspect >= 1) { sw = 440; sh = Math.max(40, Math.round(440 / aspect)); }
      else { sh = 440; sw = Math.max(40, Math.round(440 * aspect)); }
      oc.width = sw; oc.height = sh;
      const c = oc.getContext('2d');
      c.fillStyle = '#fff'; c.fillRect(0, 0, sw, sh);
      c.drawImage(el, 0, 0, sw, sh);
      this._imgSrcData = { d: c.getImageData(0, 0, sw, sh).data, sw, sh, aspect };
    } else {
      oc.width = sw; oc.height = sh;
      const c = oc.getContext('2d');
      c.fillStyle = '#FFFDFB'; c.fillRect(0, 0, sw, sh);
      c.fillStyle = '#240B21';
      c.font = "600 400px 'Instrument Sans', sans-serif";
      c.textAlign = 'center'; c.textBaseline = 'middle';
      c.fillText('a', sw / 2, sh * 0.56);
      this._imgSrcData = { d: c.getImageData(0, 0, sw, sh).data, sw, sh, aspect: 1 };
    }
    this._imgSrcKey = key;
    return this._imgSrcData;
  }

  drawMetalCube(ctx, x, y, s, rot, r, g, b, alpha) {
    ctx.save();
    ctx.translate(x, y); ctx.rotate(rot); ctx.globalAlpha = alpha;
    const li = (v, t) => Math.round(v + (255 - v) * t);
    const dk = (v, t) => Math.round(v * (1 - t));
    const grad = ctx.createLinearGradient(-s / 2, -s / 2, s / 2, s / 2);
    grad.addColorStop(0, 'rgb(' + li(r, 0.45) + ',' + li(g, 0.45) + ',' + li(b, 0.45) + ')');
    grad.addColorStop(0.45, 'rgb(' + r + ',' + g + ',' + b + ')');
    grad.addColorStop(1, 'rgb(' + dk(r, 0.42) + ',' + dk(g, 0.42) + ',' + dk(b, 0.42) + ')');
    ctx.fillStyle = grad;
    ctx.fillRect(-s / 2, -s / 2, s, s);
    ctx.fillStyle = 'rgba(255,255,255,0.30)';
    ctx.fillRect(-s / 2, -s / 2, s, s * 0.14);
    ctx.fillStyle = 'rgba(18,5,16,0.25)';
    ctx.fillRect(s / 2 - s * 0.14, -s / 2, s * 0.14, s);
    ctx.restore();
  }

  draw_cubes(ctx, W, H, phase, S, P) {
    const src = this.buildImgSource(S);
    const night = S.mode === 'night';
    const u = Math.min(W, H);
    const maxW = W * 0.9, maxH = H * 0.86;
    let bw = Math.min(maxW, maxH * src.aspect), bh = bw / src.aspect;
    const ox = (W - bw) / 2, oy = (H - bh) / 2;
    let cols = Math.round(24 + S.values.detail * 34);
    let rows = Math.max(2, Math.round(bh / (bw / cols)));
    const cap = this._hq ? 9000 : 3200;
    if (cols * rows > cap) { const f = Math.sqrt(cap / (cols * rows)); cols = Math.max(8, Math.floor(cols * f)); rows = Math.max(8, Math.floor(rows * f)); }
    const cellW = bw / cols, cellH = bh / rows;
    const rand = this.rng(S.seed);
    const e1 = this.easeIO(this.seg(phase, 0.04, 0.46));
    const out = this.easeIO(this.seg(phase, 0.74, 0.97));
    const wob = 0.15 + S.values.motion * 0.85;
    const tight = 0.55 + S.values.density * 0.55;
    const demoC = S.demo && S.demo.on;
    const hiT = demoC ? this.colArr(P.mid) : [233, 188, 169];
    const deepT = demoC ? this.colArr(this.lerpHex(P.mid, '#000000', 0.4)) : [138, 80, 92];
    for (let gy = 0; gy < rows; gy++) for (let gx = 0; gx < cols; gx++) {
      const r1 = rand(), r2 = rand(), r3 = rand(), r4 = rand();
      const px = Math.min(src.sw - 1, Math.floor((gx + 0.5) / cols * src.sw));
      const py = Math.min(src.sh - 1, Math.floor((gy + 0.5) / rows * src.sh));
      const i4 = (py * src.sw + px) * 4;
      let r = src.d[i4], g = src.d[i4 + 1], b = src.d[i4 + 2];
      const mx = Math.max(r, g, b), mn = Math.min(r, g, b);
      const lum = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
      const sat = mx === 0 ? 0 : (mx - mn) / mx;
      if (lum > 0.93 && sat < 0.09) continue; // white background masks away
      if (night) {
        // lift dark pixels toward molten rose-gold so they read on the plum field
        const dark = Math.max(0, 1 - lum / 0.55);
        const t = 0.15 + dark * 0.62;
        const gr = lum < 0.35 ? deepT : hiT;
        const mixT = lum < 0.35 ? t * 0.9 : t;
        r = Math.round(r * (1 - mixT) + (lum < 0.2 ? hiT[0] : gr[0]) * mixT);
        g = Math.round(g * (1 - mixT) + (lum < 0.2 ? hiT[1] : gr[1]) * mixT);
        b = Math.round(b * (1 - mixT) + (lum < 0.2 ? hiT[2] : gr[2]) * mixT);
      }
      const tx = ox + (gx + 0.5) * cellW, ty = oy + (gy + 0.5) * cellH;
      const ang = r1 * Math.PI * 2;
      const rad = u * (0.75 + r2 * 0.55);
      const sx = W / 2 + Math.cos(ang) * rad, sy = H / 2 + Math.sin(ang) * rad;
      const delay = r3 * 0.35;
      const eIn = this.easeIO(this.seg(e1, delay, Math.min(1, delay + 0.65)));
      const eOut = this.easeIO(this.seg(out, r4 * 0.3, Math.min(1, r4 * 0.3 + 0.7)));
      let x = sx + (tx - sx) * eIn, y = sy + (ty - sy) * eIn;
      x += (tx - sx) * -0.5 * eOut; y += (ty - sy) * -0.5 * eOut - u * 0.2 * eOut;
      x += Math.sin(phase * Math.PI * 2 + r1 * 9) * u * 0.003 * wob * eIn;
      y += Math.cos(phase * Math.PI * 2 + r2 * 9) * u * 0.003 * wob * eIn;
      const alpha = Math.max(0, Math.min(1, eIn * (1 - eOut)));
      if (alpha <= 0.01) continue;
      const s = Math.min(cellW, cellH) * tight * (0.85 + r2 * 0.3);
      const rot = (r1 - 0.5) * 1.1 * (1 - eIn) + (r4 - 0.5) * 0.12;
      this.drawMetalCube(ctx, x, y, s, rot, r, g, b, alpha);
    }
  }

  draw_kupu(ctx, W, H, phase, S, P) {
    const text = (S.kupuText || "assembl'd.").trim() || "assembl'd.";
    const night = S.mode === 'night';
    const count = Math.round((this._hq ? 2600 : 1400) + S.values.density * (this._hq ? 4200 : 2600));
    this.drawAssembly(ctx, W, H, phase, S, P, text, (r) =>
      r < 0.10 ? [P.hi, 'bright'] : r < 0.55 ? [P.mid, null] : r < 0.85 ? [night ? P.accent : P.ink, null] : [P.soft, null], 'dot', count);
  }

  draw_tick(ctx, W, H, phase, S, P) {
    const deep = (S.demo && S.demo.on) ? this.lerpHex(P.hi, '#000000', 0.45) : '#8A505C';
    this.drawAssembly(ctx, W, H, phase, S, P, '✓', (r) => r < 0.75 ? [P.hi, deep] : [P.accent, P.soft], 'cube');
    const u = Math.min(W, H);
    const ring = this.seg(phase, 0.46, 0.72);
    if (ring > 0 && ring < 1) {
      ctx.globalAlpha = (1 - ring) * 0.5;
      ctx.strokeStyle = P.mid; ctx.lineWidth = u * 0.004;
      ctx.beginPath(); ctx.arc(W / 2, H / 2, u * (0.3 + ring * 0.42), 0, Math.PI * 2); ctx.stroke();
      ctx.globalAlpha = 1;
    }
  }

  draw_threads(ctx, W, H, phase, S, P) {
    const u = Math.min(W, H);
    const K = 5 + Math.round(S.values.density * 8);
    const rand = this.rng(S.seed + 5);
    const ex = W * 0.10, ey = H * 0.5;
    const nodes = [];
    for (let i = 0; i < K; i++) {
      nodes.push({ x: W * (0.68 + rand() * 0.22), y: H * (0.12 + (i + 0.5) / K * 0.76 + (rand() - 0.5) * 0.05), r: rand() });
    }
    const win = Math.floor(this.rng(S.seed + 31)() * K);
    const lock = { x: W * 0.5, y: H * 0.82 };
    const drawB = (a, b, prog, color, lw, alpha) => {
      if (prog <= 0) return;
      const c1 = { x: a.x + (b.x - a.x) * 0.4, y: a.y }, c2 = { x: a.x + (b.x - a.x) * 0.6, y: b.y };
      const n = 60; ctx.beginPath();
      for (let i = 0; i <= n * prog; i++) {
        const t = i / n, mt = 1 - t;
        const x = mt * mt * mt * a.x + 3 * mt * mt * t * c1.x + 3 * mt * t * t * c2.x + t * t * t * b.x;
        const y = mt * mt * mt * a.y + 3 * mt * mt * t * c1.y + 3 * mt * t * t * c2.y + t * t * t * b.y;
        i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
      }
      ctx.strokeStyle = color; ctx.lineWidth = lw; ctx.globalAlpha = alpha; ctx.lineCap = 'round';
      ctx.stroke(); ctx.globalAlpha = 1;
    };
    const cast = this.easeIO(this.seg(phase, 0.02, 0.34));
    const ret = this.easeIO(this.seg(phase, 0.38, 0.58));
    const fade = this.easeIO(this.seg(phase, 0.82, 0.98));
    const speedSkew = 0.4 + S.values.motion * 0.6;
    for (let i = 0; i < K; i++) {
      const d = nodes[i].r * 0.35 * speedSkew;
      const p = this.easeIO(this.seg(cast, d, Math.min(1, d + 0.65)));
      const isWin = i === win;
      drawB({ x: ex, y: ey }, nodes[i], p, isWin ? P.mid : P.soft, u * (isWin ? 0.006 : 0.0035), (isWin ? 0.95 : 0.35) * (1 - fade));
      if (p > 0.98) {
        ctx.globalAlpha = (isWin ? 1 : 0.45) * (1 - fade);
        ctx.fillStyle = isWin ? P.mid : P.faint;
        ctx.beginPath(); ctx.arc(nodes[i].x, nodes[i].y, u * (isWin ? 0.012 : 0.008), 0, Math.PI * 2); ctx.fill();
        ctx.globalAlpha = 1;
      }
    }
    ctx.fillStyle = P.ink; ctx.beginPath(); ctx.arc(ex, ey, u * 0.014, 0, Math.PI * 2); ctx.fill();
    drawB(nodes[win], lock, ret, P.mid, u * 0.005, 0.9 * (1 - fade));
    if (ret > 0.98) {
      const pop = 1 + Math.sin(Math.min(1, this.seg(phase, 0.58, 0.7)) * Math.PI) * 0.25;
      ctx.globalAlpha = 1 - fade;
      ctx.strokeStyle = P.mid; ctx.lineWidth = u * 0.008; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      const s = u * 0.028 * pop;
      ctx.beginPath();
      ctx.moveTo(lock.x - s, lock.y);
      ctx.lineTo(lock.x - s * 0.25, lock.y + s * 0.7);
      ctx.lineTo(lock.x + s, lock.y - s * 0.6);
      ctx.stroke();
      if (!this._noText) {
        ctx.font = "500 " + Math.round(u * 0.024) + "px 'IBM Plex Mono', monospace";
        ctx.fillStyle = P.ink; ctx.textAlign = 'center';
        ctx.fillText("it's assembl'd.", lock.x, lock.y + u * 0.075);
      }
      ctx.globalAlpha = 1;
    }
  }

  draw_evidence(ctx, W, H, phase, S, P) {
    const rows = [
      'PROBLEM   → broken gate, west side',
      'WHERE     → Tāmaki Makaurau · Grey Lynn',
      'WHEN      → before Friday 4pm',
      'TRADE     → handyman or fencing',
      'STATUS    → broadcasting…',
      'ACCEPTED  → first to accept, wins',
      'PROBLEM   → nails, 2pm today',
      'WHERE     → Ponsonby · Luxe Beauty',
      'VERIFIED  → ✓ published availability',
      'WHEN      → tonight, after five',
      'WHERE     → Ōtautahi · Riccarton',
      'FROM HERE → it is between you and them.',
    ];
    const u = Math.min(W, H);
    const cols = 3 + Math.round(S.values.density * 3);
    const rand = this.rng(S.seed + 2);
    for (let ci = 0; ci < cols; ci++) {
      const fs = u * 0.017 * (0.75 + rand() * 0.9) * (0.7 + S.values.detail * 0.6);
      const lh = fs * 2.1;
      const patH = rows.length * lh;
      const x = W * (0.04 + (ci + rand() * 0.5) / cols * 0.92);
      const dir = ci % 2 === 0 ? 1 : -1;
      const loops = 1 + Math.floor(rand() * 2 * (0.5 + S.values.motion));
      const off = rand() * patH;
      const yShift = ((phase * loops * patH * dir + off) % patH + patH) % patH;
      const alpha = 0.10 + rand() * 0.38;
      ctx.font = "400 " + Math.round(fs) + "px 'IBM Plex Mono', monospace";
      ctx.textAlign = 'left';
      for (let k = -1; k < Math.ceil(H / patH) + 1; k++) {
        for (let ri = 0; ri < rows.length; ri++) {
          const y = k * patH + ri * lh - yShift + lh;
          if (y < -lh || y > H + lh) continue;
          const verified = rows[ri].indexOf('VERIFIED') === 0;
          ctx.fillStyle = verified ? P.mid : (ri % 3 === 0 ? P.ink : P.soft);
          ctx.globalAlpha = verified ? Math.min(0.8, alpha + 0.2) : alpha;
          ctx.fillText(rows[ri], x, y);
        }
      }
      ctx.globalAlpha = 1;
    }
  }

  draw_koru(ctx, W, H, phase, S, P) {
    const u = Math.min(W, H);
    const F = 3 + Math.round(S.values.density * 5);
    const rand = this.rng(S.seed + 9);
    const grow = this.easeIO(this.seg(phase, 0.02, 0.6));
    const fadeO = this.easeIO(this.seg(phase, 0.86, 0.99));
    const sway = Math.sin(phase * Math.PI * 2) * (0.2 + S.values.motion * 0.8);
    for (let f = 0; f < F; f++) {
      const bx = W * (0.1 + rand() * 0.8);
      const hgt = H * (0.35 + rand() * 0.45);
      const flip = rand() > 0.5 ? 1 : -1;
      const R = u * (0.05 + rand() * 0.06) * (0.7 + S.values.detail * 0.6);
      const night = S.mode === 'night';
      const col = night
        ? (f % 3 === 0 ? P.mid : f % 3 === 1 ? P.hi : P.accent)
        : (f % 3 === 0 ? P.ink : f % 3 === 1 ? P.mid : P.soft);
      const delay = rand() * 0.35;
      const g = this.easeIO(this.seg(grow, delay, Math.min(1, delay + 0.6)));
      if (g <= 0.01) continue;
      const N = 120;
      const reach = Math.floor(N * g);
      const cx0 = bx + sway * u * 0.02 * flip;
      const topY = H - hgt;
      const scx = cx0 + flip * R * 0.4, scy = topY + R;
      ctx.globalAlpha = (night ? 0.9 : 0.55 + 0.35 * (f % 2)) * (1 - fadeO);
      ctx.strokeStyle = col; ctx.lineCap = 'round';
      let prev = null;
      for (let i = 0; i <= reach; i++) {
        const t = i / N;
        let x, y;
        if (t < 0.45) {
          const tt = t / 0.45;
          x = bx + Math.sin(tt * 2.4 + f) * u * 0.015 * sway + flip * tt * R * 0.3;
          y = H - tt * (hgt - R * 1.6);
        } else {
          const tt = (t - 0.45) / 0.55;
          const th = tt * Math.PI * 2.6;
          const rr = R * Math.exp(-0.55 * th);
          x = scx + flip * Math.sin(th + sway * 0.15) * rr * 1.15 - flip * R * 0.3;
          y = scy - Math.cos(th) * rr - R * 0.55;
        }
        if (prev) {
          ctx.lineWidth = Math.max(u * 0.0016, u * 0.008 * (1 - t * 0.85));
          ctx.beginPath(); ctx.moveTo(prev[0], prev[1]); ctx.lineTo(x, y); ctx.stroke();
        }
        prev = [x, y];
      }
      if (g > 0.985 && prev) {
        ctx.fillStyle = P.hi;
        ctx.beginPath(); ctx.arc(prev[0], prev[1], u * 0.006, 0, Math.PI * 2); ctx.fill();
      }
      ctx.globalAlpha = 1;
    }
  }

  draw_coast(ctx, W, H, phase, S, P) {
    const u = Math.min(W, H);
    const nz = this._coastNz && this._coastNzSeed === S.seed ? this._coastNz : (this._coastNzSeed = S.seed, this._coastNz = this.noiseFn(S.seed + 77));
    const rand = this.rng(S.seed + 3);
    const blobs = [];
    const nb = 2 + Math.round(rand() * 1.4);
    for (let b = 0; b < nb; b++) blobs.push({ x: W * (0.22 + rand() * 0.56), y: H * (0.22 + rand() * 0.56), s: u * (0.10 + rand() * 0.13), ph: rand() * 9 });
    const rings = 6 + Math.round(S.values.detail * 10);
    const driftA = Math.sin(phase * Math.PI * 2) * (0.15 + S.values.motion * 0.5);
    const driftB = Math.cos(phase * Math.PI * 2) * (0.15 + S.values.motion * 0.5);
    for (const b of blobs) {
      for (let L = 0; L < rings; L++) {
        const base = b.s * (0.35 + L * (0.9 / rings) * (1.2 + S.values.density));
        const inner = L === 0;
        ctx.beginPath();
        const NPT = 140;
        for (let i = 0; i <= NPT; i++) {
          const th = (i / NPT) * Math.PI * 2;
          const nx = Math.cos(th) * 1.6 + b.ph + driftA * 0.3;
          const ny = Math.sin(th) * 1.6 + b.ph * 2 + driftB * 0.3;
          const r = base * (1 + 0.42 * (nz(nx + L * 0.22, ny) - 0.5) * 2);
          const x = b.x + Math.cos(th) * r, y = b.y + Math.sin(th) * r * 0.92;
          i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
        }

  draw_grid(ctx, W, H, phase, S, P) {
