<svg xmlns="http://www.w3.org/2000/svg" width="480" height="480" viewBox="0 0 480 480" fill="none">
  <!-- Family OS — HT-style scattered line art: hearth, calendar, keys, school bag, shared meal. -->
  <g stroke="#2A2620" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.5">
    <!-- hearth / home -->
    <path d="M60 140l60-48 60 48v72H60v-72z"/>
    <path d="M96 212v-40h48v40"/>
    <path d="M90 120c0-14 10-24 30-24s20 8 30 8 14-8 30-8 30 10 30 24"/>
    <!-- calendar -->
    <rect x="220" y="60" width="70" height="58" rx="4"/>
    <path d="M236 60v-12M274 60v-12M220 82h70"/>
    <circle cx="240" cy="98" r="3" fill="#2A2620" stroke="none"/>
    <circle cx="256" cy="98" r="3" fill="#2A2620" stroke="none"/>
    <circle cx="272" cy="98" r="3" fill="#2A2620" stroke="none"/>
    <!-- keys -->
    <circle cx="360" cy="90" r="16"/>
    <circle cx="360" cy="90" r="6"/>
    <path d="M360 106v48M360 130h14M360 142h10"/>
    <!-- school bag -->
    <path d="M60 280h70l8 70H52l8-70z"/>
    <path d="M78 280v-18c0-12 10-20 22-20s22 8 22 20v18"/>
    <path d="M70 310h50"/>
    <!-- shared plate -->
    <ellipse cx="220" cy="300" rx="48" ry="28"/>
    <ellipse cx="220" cy="300" rx="28" ry="14"/>
    <path d="M180 300h-20M280 300h20"/>
    <!-- bike / pickup -->
    <circle cx="360" cy="280" r="22"/>
    <circle cx="420" cy="280" r="22"/>
    <path d="M360 280h60M390 280l-16-36h28"/>
    <!-- heart (small, sparse) -->
    <path d="M100 400c0-12 8-20 20-20s12 6 20 6 10-6 20-6 20 8 20 20c0 22-40 40-40 40s-40-18-40-40z"/>
    <!-- shopping list ticks -->
    <path d="M220 380h70M220 398h54M220 416h62"/>
    <path d="M200 380l6 6 12-12"/>
    <!-- soft star / matariki hint -->
    <path d="M400 380l4 12 12 4-12 4-4 12-4-12-12-4 12-4z"/>
    <path d="M40 200c16-4 28 6 28 20"/>
    <path d="M420 160c-12 8-14 24-4 36"/>
  </g>
  <g stroke="#BFA37A" stroke-width="1.35" stroke-linecap="round" fill="none" opacity="0.45">
    <path d="M160 160c20-8 36 0 44 16"/>
    <circle cx="300" cy="200" r="12"/>
    <path d="M40 360c20 10 36 30 40 52"/>
  </g>
</svg>
