<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 40" role="img" aria-label="Acme">
  <!-- Neutral stand-in wordmark for the fictional white-label customer in the
       demo lab. Deliberately generic: it must not read as an assembl mark, and
       it must not be a real company's logo. -->
  <rect x="1" y="1" width="158" height="38" rx="10" fill="none" stroke="#8FB8D6" stroke-width="1.5" opacity="0.7"/>
  <circle cx="26" cy="20" r="8" fill="none" stroke="#8FB8D6" stroke-width="2.5"/>
  <circle cx="26" cy="20" r="2.5" fill="#8FB8D6"/>
  <text x="46" y="26" font-family="Lato, system-ui, sans-serif" font-size="16" font-weight="700"
        letter-spacing="2.5" fill="#3a3832">ACME</text>
</svg>
