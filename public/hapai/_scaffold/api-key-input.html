<div class="field">
  <label class="label" for="key-input">api key</label>
  <div class="key-row">
    <input id="key-input" class="text mono" type="password" autocomplete="off" spellcheck="false">
    <button class="button secondary" type="button" id="show-key">show</button>
    <button class="button secondary" type="button" id="save-key">save</button>
  </div>
  <div class="key-status" id="key-status">key stored in this browser only.</div>
  <button class="forget" type="button" id="forget-key">forget key</button>
</div>
