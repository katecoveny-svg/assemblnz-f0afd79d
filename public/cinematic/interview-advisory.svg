<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 650" role="img" aria-labelledby="title desc"><title id="title">A clearer client conversation</title><desc id="desc">Independent illustrative workflow. Sample questions only; no client systems or checked sources.</desc><defs><filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#240B21" flood-opacity=".08"/></filter></defs><rect width="760" height="650" rx="28" fill="#F5F1F2"/><g font-family="Arial,sans-serif" fill="#240B21"><text x="40" y="48" font-size="12" letter-spacing="2">INDEPENDENT CONCEPT · SAMPLE DATA</text><text x="40" y="92" font-size="30" font-weight="600">A clearer client conversation</text><text x="40" y="122" font-size="15" fill="#654A4E">One question · checked evidence · a bounded next step</text><path d="M205 248H555M205 418H555M205 248V418M555 248V418" fill="none" stroke="#916A70" stroke-width="3" stroke-dasharray="7 7"/><g filter="url(#shadow)"><rect x="40" y="160" width="330" height="138" rx="22" fill="#FFFDFB" stroke="#dfd1d8"/></g><circle cx="72" cy="192" r="14" fill="#240B21"/><text x="67" y="196" font-size="11" fill="#FFFDFB">01</text><text x="64" y="232" font-size="20" font-weight="600">The client question</text><text x="64" y="260" font-size="14">What needs understanding?</text><text x="64" y="281" font-size="11" fill="#654A4E">Fictional client only</text><g filter="url(#shadow)"><rect x="390" y="160" width="330" height="138" rx="22" fill="#EAC8DF" stroke="#dfd1d8"/></g><circle cx="422" cy="192" r="14" fill="#240B21"/><text x="417" y="196" font-size="11" fill="#FFFDFB">02</text><text x="414" y="232" font-size="20" font-weight="600">Evidence to collect</text><text x="414" y="260" font-size="14">Source, publication and retrieval dates</text><text x="414" y="281" font-size="11" fill="#654A4E">No live retrieval in this example</text><g filter="url(#shadow)"><rect x="40" y="325" width="330" height="138" rx="22" fill="#DAD2F4" stroke="#dfd1d8"/></g><circle cx="72" cy="357" r="14" fill="#240B21"/><text x="67" y="361" font-size="11" fill="#FFFDFB">03</text><text x="64" y="397" font-size="20" font-weight="600">A useful first scope</text><text x="64" y="425" font-size="14">Finite deliverable and success measure</text><text x="64" y="446" font-size="11" fill="#654A4E">Proposal, not a commitment</text><g filter="url(#shadow)"><rect x="390" y="325" width="330" height="138" rx="22" fill="#FFFDFB" stroke="#dfd1d8"/></g><circle cx="422" cy="357" r="14" fill="#240B21"/><text x="417" y="361" font-size="11" fill="#FFFDFB">04</text><text x="414" y="397" font-size="20" font-weight="600">The human handoff</text><text x="414" y="425" font-size="14">Review facts, permissions and gaps</text><text x="414" y="446" font-size="11" fill="#654A4E">No recipient or appointment invented</text><rect x="40" y="510" width="680" height="94" rx="20" fill="#240B21"/><text x="65" y="545" font-size="18" font-weight="600" fill="#FFFDFB">Human review before the next step</text><text x="65" y="574" font-size="14" fill="#FFFDFB">Illustrative only · evidence required · no action sent</text></g></svg>
