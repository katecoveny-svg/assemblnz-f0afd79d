<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DO controlled cart proof</title><style>body{max-width:640px;margin:32px auto;padding:16px;font:16px system-ui;color:#492b3e;background:#fffdfb}article{padding:20px 0;border-bottom:1px solid #916a70}input,button{font:inherit;padding:12px}output{display:block;margin:12px 0}pre{white-space:pre-wrap;overflow-wrap:anywhere}</style>
<h1>Controlled cart fixture</h1><p>Fictional products. No retailer, account, purchase or remote service.</p>
<main data-do-cart-fixture data-document="fixture-document" data-navigation="0" data-revision="0">
<article data-product="oats" data-price="350" data-available="true"><h2 data-name>Fixture oats</h2><p>NZD 3.50</p><output>0</output><label>Quantity <input type="number" min="1" max="20" value="1"></label><button data-set-quantity type="button">Set quantity</button></article>
<article data-product="milk" data-price="480" data-available="true"><h2 data-name>Fixture milk</h2><p>NZD 4.80</p><output>0</output><label>Quantity <input type="number" min="1" max="20" value="1"></label><button data-set-quantity type="button">Set quantity</button></article>
</main><button id="prepare">Review two oats and one milk</button><pre id="review"></pre><button id="approve" disabled>Approve reviewed fixture quantities</button><button id="execute" disabled>Execute fixture review</button><pre id="receipt" role="status"></pre><script type="module" src="/fixture-bundle.js"></script></html>
